<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCEF GitHub Pages Demo</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 2rem; max-width: 1100px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    input, select, button { padding: 0.45rem; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow: auto; }
    .muted { color: #555; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Data Center Equipment Finder — GitHub Pages</h1>
  <p class="muted">Static preview for online development checks. Data source: <code>docs/equipment_catalog.json</code></p>

  <div class="card">
    <h3>Closest match search</h3>
    <div class="row">
      <select id="category">
        <option value="">category (any)</option>
        <option value="valve">valve</option>
        <option value="strainer">strainer</option>
        <option value="filter_dryer">filter_dryer</option>
        <option value="cdu">cdu</option>
        <option value="chiller">chiller</option>
      </select>
      <input id="subtype" placeholder="subtype (optional)" />
      <input id="brand" placeholder="brand (optional)" />
      <input id="size" type="number" step="any" placeholder="size mm" />
      <input id="cv" type="number" step="any" placeholder="cv (valve/strainer)" />
      <input id="kv" type="number" step="any" placeholder="kv (valve/strainer)" />
      <input id="cap" type="number" step="any" placeholder="capacity kW (CDU/chiller/filter_dryer)" />
      <input id="topn" type="number" value="5" min="1" max="50" />
      <button id="find">Find</button>
    </div>
    <pre id="findOut">Waiting for query...</pre>
  </div>

  <div class="card">
    <h3>Compatibility check</h3>
    <div class="row">
      <input id="parts" placeholder="part numbers: LLD-20,DML-20" style="min-width: 320px;" />
      <input id="material" placeholder="required material (optional)" />
      <input id="connStd" placeholder="required connection standard (optional)" />
      <input id="coolant" placeholder="required coolant token (optional)" />
      <input id="maxTime" type="number" step="any" placeholder="max connection time (min)" />
      <button id="compat">Check</button>
    </div>
    <pre id="compatOut">Waiting for request...</pre>
  </div>

  <div class="card">
    <h3>Hybrid AI assistant</h3>
    <div class="row">
      <select id="aiMode">
        <option value="hybrid">hybrid</option>
        <option value="local">local</option>
      </select>
      <input id="apiBase" placeholder="API base (optional), e.g. http://127.0.0.1:8000" style="min-width: 320px;" />
      <input id="aiQuery" placeholder="find check valve 20 mm kv 6 from Danfoss" style="min-width: 360px;" />
      <button id="assist">Ask AI</button>
    </div>
    <pre id="aiOut">Waiting for request...</pre>
  </div>

  <script src="./app.js"></script>
</body>
</html>
