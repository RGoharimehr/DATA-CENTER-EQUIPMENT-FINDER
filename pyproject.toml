[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacenter-equipment-finder"
version = "0.1.0"
description = "Find closest data-center cooling components by required size/capacity and compatibility."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RGoharimehr"}]
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.13.5,<3",
  "pypdf>=6.18.0,<7",
  "rapidfuzz>=3.14.6,<4",
]
keywords = ["datacenter", "cooling", "cdu", "chiller", "cv", "kv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
dcef = "datacenter_equipment_finder.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.6,<0.17",
  "mypy>=2.3.1,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datacenter_equipment_finder = ["data/*.csv", "data/*.sqlite", "data/vendors/*.csv", "data/catalog_downloads/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
